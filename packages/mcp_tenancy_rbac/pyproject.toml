[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-tenancy-rbac"
version = "1.0.0"
description = "Enterprise Multi-Tenancy RBAC & ABAC Authorization Engine for Starlette, FastAPI, and MCP Servers"
readme = "README.md"
authors = [
    { name = "Antigravity Engineering", email = "engineering@antigravity.ai" }
]
license = { text = "MIT" }
keywords = ["rbac", "abac", "multi-tenancy", "authorization", "starlette", "fastapi", "mcp", "supabase"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "starlette>=0.27.0",
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0"
]

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.19.0"]
mongo = ["motor>=3.3.0", "pymongo>=4.6.0"]
full = ["aiosqlite>=0.19.0", "motor>=3.3.0", "pymongo>=4.6.0"]

[project.urls]
Homepage = "https://github.com/sdr999/mcp_server"
Documentation = "https://github.com/sdr999/mcp_server/tree/main/docs"
