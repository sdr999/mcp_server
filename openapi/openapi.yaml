openapi: "3.0.3"
info:
  title: MCP Tool Server API
  version: "1.0.0"
  description: |
    ### OpenAPI schema & Interactive API for the MCP Tool Server.

    ---
    ### 🛠️ How to Author & Onboard Tools:

    When onboarding tools via `POST /admin/tools/onboard`, use the `@tool` decorator from `tools_sdk`:

    ```python
    from tools_sdk import tool

    # Helper functions without @tool remain private/internal
    def get_internal_data() -> str:
        return "secret_value"

    # Functions decorated with @tool become exposed MCP tools
    @tool(description="Public MCP tool description")
    def my_tool(input_param: str) -> dict:
        data = get_internal_data()
        return {"result": input_param, "data": data}
    ```

    #### Authoring Rules for New Developers:

    1. **Import `tool`**: Always include `from tools_sdk import tool` at top of file when using `@tool()`.

    2. **Public vs Private**: Only functions marked with `@tool()` are exposed to clients. Un-decorated functions act as internal helpers.

    3. **Pip Dependencies**: List any external PyPI packages in the `"requirements": ["package_name"]` array.

    4. **Dry-Run Test**: Use `POST /admin/tools/validate_source` to dry-run test python code syntax before onboarding.


servers:
  - url: http://localhost:8000
    description: Local MCP Server


tags:
  - name: Authentication & Identity
    description: Supabase Auth endpoints (sign up, sign in, token refresh, password recovery) and identity inspection
  - name: Tools
    description: Tool catalog and execution
  - name: Onboarding & Admin
    description: Administration, onboarding, multi-tenancy management, and proposal approval workflow
  - name: System
    description: Liveness, readiness, status, and metrics
  - name: Federation
    description: Upstream MCP server federation


paths:
  /whoami:
    get:
      tags:
        - Authentication & Identity
      summary: Inspect Authenticated Principal Identity
      description: Returns the resolved caller Principal (User ID, Supabase UUID, active tenant org, workspace, roles, and permissions).
      operationId: getWhoAmI
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - AdminTokenAuth: []
        - {}
      responses:
        '200':
          description: Resolved Principal identity object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'

  /auth/signup:
    post:
      tags:
        - Authentication & Identity
      summary: User Sign Up (Supabase Auth)
      description: Register a new user with email and password via Supabase Auth.
      operationId: authSignUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid parameters or account already exists
        '503':
          description: Supabase auth service unconfigured or unavailable

  /auth/signin:
    post:
      tags:
        - Authentication & Identity
      summary: User Sign In (Supabase Auth)
      description: Authenticate user with email and password to receive JWT access_token and refresh_token.
      operationId: authSignIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
        '503':
          description: Supabase auth service unconfigured or unavailable

  /auth/refresh:
    post:
      tags:
        - Authentication & Identity
      summary: Refresh Access Token
      description: Exchange a valid refresh token for a new access token.
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid or missing refresh token

  /auth/forgot-password:
    post:
      tags:
        - Authentication & Identity
      summary: Send Password Reset Email
      description: Trigger a password recovery email for the specified email address.
      operationId: authForgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset email sent if account exists

  /mcp:
    get:
      tags:
        - Tools
      summary: FastMCP SSE Stream Endpoint
      description: Establishes a Server-Sent Events (SSE) stream connection for FastMCP protocol notifications.
      operationId: mcpSseStream
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: EventStream connection opened
    post:
      tags:
        - Tools
      summary: FastMCP Protocol Streamable Endpoint
      description: Primary Streamable HTTP / JSON-RPC endpoint for Model Context Protocol (MCP) tool execution and listing.
      operationId: mcpEndpoint
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: MCP JSON-RPC Response or Event Stream
    delete:
      tags:
        - Tools
      summary: FastMCP Session Disconnect
      description: Closes an active FastMCP session.
      operationId: mcpSessionDisconnect
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Session terminated



  /docs:
    get:

      tags:
        - System
      summary: Interactive Swagger UI Documentation
      description: Interactive HTML documentation page for exploring and invoking API endpoints.
      operationId: getSwaggerDocs
      responses:
        '200':
          description: HTML page containing Swagger UI
          content:
            text/html:
              schema:
                type: string

  /swagger:
    get:
      tags:
        - System
      summary: Swagger UI Alias
      description: Alias for /docs.
      operationId: getSwaggerAlias
      responses:
        '200':
          description: HTML page containing Swagger UI
          content:
            text/html:
              schema:
                type: string

  /openapi.json:
    get:
      tags:
        - System
      summary: OpenAPI JSON Specification
      description: Returns the OpenAPI 3.0 specification in JSON format.
      operationId: getOpenApiJson
      responses:
        '200':
          description: OpenAPI 3.0 JSON specification
          content:
            application/json:
              schema:
                type: object

  /openapi.yaml:
    get:
      tags:
        - System
      summary: OpenAPI YAML Specification
      description: Returns the OpenAPI 3.0 specification in YAML format.
      operationId: getOpenApiYaml
      responses:
        '200':
          description: OpenAPI 3.0 YAML specification
          content:
            text/yaml:
              schema:
                type: string

  /healthz:

    get:
      tags:
        - System
      summary: Liveness check
      description: Returns server liveness status. Always open.
      operationId: getHealthz
      responses:
        '200':
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /admin/orgs:
    get:
      tags:
        - Onboarding & Admin
      summary: List Organizations
      description: Returns list of registered organizations in the tenancy store. Requires admin token or SuperAdmin JWT.
      operationId: adminListOrgs
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    org_id:
                      type: string
                    name:
                      type: string
                    status:
                      type: string
                    created_at:
                      type: number

    post:
      tags:
        - Onboarding & Admin
      summary: Create Organization
      description: Registers a new organization tenant in the store. Requires admin token or SuperAdmin JWT.
      operationId: adminCreateOrg
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      requestBody:

        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - org_id
                - name
              properties:
                org_id:
                  type: string
                name:
                  type: string
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                type: object
                properties:
                  org_id:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                  created_at:
                    type: number


  /readyz:
    get:
      tags:
        - System
      summary: Readiness check
      description: Returns 200 once the initial tool load completes, else 503.
      operationId: getReadyz
      responses:
        '200':
          description: Server is ready to serve tools
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                    example: true
        '503':
          description: Server is still loading tools

  /status:
    get:
      tags:
        - System
      summary: Get server status
      description: Returns server readiness, active transport, auth mode, and tool loading stats.
      operationId: getStatus
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: Server status details
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                  auth:
                    type: string
                  transport:
                    type: string
                  source:
                    type: string
                  stats:
                    type: object

  /tools:
    get:
      tags:
        - Tools
      summary: List registered tools catalog
      description: Returns all currently registered tools, their descriptions, and parameters.
      operationId: listTools
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: List of registered tools
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolInfo'

  /tools/{name}/call:
    post:
      tags:
        - Tools
      summary: Execute a tool by name
      description: Direct HTTP execution of a registered tool with JSON arguments.
      operationId: callTool
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the registered tool to execute
          schema:
            type: string
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                arguments:
                  type: object
                  description: Keyword arguments to pass to the tool function
                  example: {}
      responses:
        '200':
          description: Tool execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCallResponse'
        '400':
          description: Invalid arguments or request body
        '404':
          description: Tool not found or disabled

  /metrics:
    get:
      tags:
        - System
      summary: Prometheus metrics
      description: Scrape Prometheus formatted metrics for tool calls, durations, and errors.
      operationId: getMetrics
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: Prometheus metrics exposition
          content:
            text/plain:
              schema:
                type: string

  /admin/logs:
    get:
      tags:
        - Onboarding & Admin
      summary: Retrieve server & audit log streams
      description: Retrieve structured JSON server logs and administrative audit logs with filtering by level, trace ID, or search query.
      operationId: getAdminLogs
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [server, audit, all]
            default: server
          description: Log stream category
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
          description: Maximum lines to return (max 1000)
        - in: query
          name: level
          schema:
            type: string
            enum: [INFO, WARNING, ERROR]
          description: Filter by log level
        - in: query
          name: trace_id
          schema:
            type: string
          description: Filter by specific Trace ID
        - in: query
          name: search
          schema:
            type: string
          description: Search term in log messages
      responses:
        '200':
          description: Log entries stream
          content:
            application/json:
              schema:
                type: object
                properties:
                  log_type:
                    type: string
                  count:
                    type: integer
                  logs:
                    type: array
                    items:
                      type: object

  /admin/tools/onboard:

    post:
      tags:
        - Onboarding & Admin
      summary: Onboard / Add a new tool
      description: |
        Add a new tool module dynamically by supplying its Python source code and optional pip requirements.
        The server risk-assesses dependencies, installs them if allowed, and hot-loads the tool into the registry.
      operationId: onboardTool
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - source
              properties:
                name:
                  type: string
                  description: Python module name (e.g. calculator)
                  example: calculator
                source:
                  type: string
                  description: Python source code containing tools
                  example: |
                    from tools_sdk import tool

                    @tool()
                    def add(a: int, b: int) -> int:
                        return a + b
                requirements:
                  type: array
                  items:
                    type: string
                  description: Optional pip package requirements
                  example: []
                overwrite:
                  type: boolean
                  description: Whether to overwrite an existing tool file
                  default: false
                auto_heal:
                  type: boolean
                  description: Whether to auto-apply code fixes (missing @tool, missing imports, inferred requirements)
                  default: true
      responses:
        '201':
          description: Tool successfully onboarded and loaded immediately
        '202':
          description: Tool held in pending state for admin review
        '400':
          description: Invalid source or requirements
        '409':
          description: Conflict (tool exists and overwrite is false)
        '503':
          description: Onboarding disabled or admin API disabled

  /admin/tools/validate_source:
    post:
      tags:
        - Onboarding & Admin
      summary: Dry-run validate tool source code & generate Auto-Fix Proposal
      description: Dry-run validation endpoint to check Python source code syntax, detect imports, risk-assess requirements, and generate a Self-Healing Auto-Fix Proposal without modifying server state or disk.
      operationId: validateToolSource
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source
              properties:
                name:
                  type: string
                  description: Target tool name for decorator matching
                source:
                  type: string
                  description: Python source code to validate
                  example: |
                    from tools_sdk import tool

                    @tool()
                    def ping() -> str:
                        return "pong"
                requirements:
                  type: array
                  items:
                    type: string
                  example: []
      responses:
        '200':
          description: Dry-run validation & Auto-Fix Proposal result
          content:
            application/json:
              schema:
                type: object
                properties:
                  syntax_ok:
                    type: boolean
                  has_autofix:
                    type: boolean
                  original_source:
                    type: string
                  corrected_source:
                    type: string
                  suggested_requirements:
                    type: array
                    items:
                      type: string
                  autofix_summary:
                    type: array
                    items:
                      type: string
                  tools_found:
                    type: array
                    items:
                      type: string
                  detected_imports:
                    type: array
                    items:
                      type: string
                  risk_reports:
                    type: array
                    items:
                      type: object
                  hints:
                    type: array
                    items:
                      type: string

  /admin/tools/{name}/revert:
    post:
      tags:
        - Onboarding & Admin
      summary: Revert an auto-healed tool to its original source code
      description: Reverts an auto-healed live or pending tool back to the exact original Python source code submitted prior to self-healing.
      operationId: revertTool
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: Tool name to revert
      responses:
        '200':
          description: Tool successfully reverted to original source code
        '404':
          description: Tool or original source record not found

  /admin/tools/onboard/accept_proposal:
    post:
      tags:
        - Onboarding & Admin
      summary: One-Click Accept Auto-Fix Proposal and Onboard
      description: Accepts a dry-run proposal, applies all auto-healing fixes, and onboards the tool in a single request.
      operationId: acceptProposalAndOnboard
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - source
              properties:
                name:
                  type: string
                source:
                  type: string
                requirements:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Proposal accepted and tool onboarded

  /admin/tools/{name}/auto_patch:
    post:
      tags:
        - Onboarding & Admin
      summary: Auto-patch a tool experiencing runtime or syntax issues
      description: Scans a tool's source code, applies AST auto-healing patches, and re-onboards the tool cleanly.
      operationId: autoPatchTool
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: Tool name to auto-patch
      responses:
        '200':
          description: Tool successfully patched and re-loaded
        '404':
          description: Tool not found


  /admin/tools/pending:


    get:
      tags:
        - Onboarding & Admin
      summary: List pending tools
      description: List tool onboarding submissions awaiting admin review.
      operationId: listPendingTools
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      responses:
        '200':
          description: List of pending tools

  /admin/tools/pending/{name}:
    get:
      tags:
        - Onboarding & Admin
      summary: Inspect pending tool details
      description: Get source code, dependency risk analysis, and status of a pending tool submission.
      operationId: getPendingTool
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      responses:
        '200':
          description: Pending tool details
        '404':
          description: Pending tool not found

  /admin/tools/pending/{name}/approve:
    post:
      tags:
        - Onboarding & Admin
      summary: Approve pending tool
      description: Approve a pending tool submission, installing requirements and registering the tool.
      operationId: approvePendingTool
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      responses:
        '200':
          description: Tool approved and registered
        '404':
          description: Pending tool not found

  /admin/tools/pending/{name}/reject:
    post:
      tags:
        - Onboarding & Admin
      summary: Reject pending tool
      description: Reject and remove a pending tool submission.
      operationId: rejectPendingTool
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      responses:
        '200':
          description: Tool submission rejected

  /admin/reload/{name}:
    post:
      tags:
        - Onboarding & Admin
      summary: Reload a tool module
      description: Hot-reload the module that defines the specified tool.
      operationId: reloadTool
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      responses:
        '200':
          description: Module reloaded

  /admin/tool/{name}/disable:
    post:
      tags:
        - Onboarding & Admin
      summary: Disable a tool
      description: Unregister a tool and keep it disabled across reloads.
      operationId: disableTool
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      responses:
        '200':
          description: Tool disabled

  /admin/tool/{name}/enable:
    post:
      tags:
        - Onboarding & Admin
      summary: Enable a tool
      description: Re-enable and reload a previously disabled tool.
      operationId: enableTool
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      responses:
        '200':
          description: Tool enabled

  /mcp/upstreams:
    get:
      tags:
        - Federation
      summary: List upstream MCP servers
      description: List all configured upstream remote MCP servers.
      operationId: listUpstreams
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Upstream servers list

  /mcp/upstreams/{server}/tools:
    get:
      tags:
        - Federation
      summary: List tools from an upstream server
      description: Query an upstream MCP server for its catalog of available tools.
      operationId: listUpstreamTools
      parameters:
        - name: server
          in: path
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of tools from upstream

  /mcp/upstreams/{server}/tools/{name}/call:
    post:
      tags:
        - Federation
      summary: Call tool on an upstream server
      description: Execute a tool on a remote upstream MCP server.
      operationId: callUpstreamTool
      parameters:
        - name: server
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:

        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                arguments:
                  type: object
      responses:
        '200':
          description: Upstream tool result

  /admin/mcp/upstreams:
    post:
      tags:
        - Federation
      summary: Add runtime upstream server with security credentials
      description: |

        Register a new remote MCP server at runtime with security credentials.
        
        ### Auth Mode Quick Guide (What to give & what can be empty):
        - **API Key (`auth_type: "api_key"`)**:
          - **Give**: `name`, `url`, `api_key`, and optional `header_name` (default: `X-API-Key`).

          - **Leave empty**: `token`, `token_url`, `client_id`, `client_secret`.

        - **Bearer Token (`auth_type: "bearer"`)**:

          - **Give**: `name`, `url`, `token`.

          - **Leave empty**: `api_key`, `header_name`, `token_url`, `client_id`, `client_secret`.

        - **OAuth 2.0 (`auth_type: "oauth"`)**:

          - **Give**: `name`, `url`, `token_url`, `client_id`, `client_secret`.

          - **Leave empty**: `token`, `api_key`, `header_name`.

        - **Custom Headers (`auth_type: "custom"`)**:

          - **Give**: `name`, `url`, `headers` dict (e.g. `{"X-Tenant-ID": "acme"}`).

          - **Leave empty**: `token`, `api_key`, `token_url`.

        - **No Auth (`auth_type: "none"`)**:

          - **Give**: `name`, `url`.

          - **Leave empty**: All security fields.
          
      operationId: addUpstream
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - url
              properties:
                name:
                  type: string
                  description: "REQUIRED: Unique identifier for the remote MCP server"
                  example: poc_server
                url:
                  type: string
                  description: "REQUIRED: Target HTTP/SSE URL of the remote MCP server"
                  example: http://localhost:9000
                auth_type:
                  type: string
                  enum: [bearer, api_key, oauth, custom, none]
                  description: "OPTIONAL: Explicit authentication mode selector (bearer, api_key, oauth, custom, none)"
                  example: api_key
                api_key:
                  type: string
                  description: "For auth_type=api_key: Secret API Key string. Leave empty for bearer/oauth."
                  example: secret_key_12345
                header_name:
                  type: string
                  description: "For auth_type=api_key: HTTP header name for API Key. Default is 'X-API-Key'."
                  example: X-API-Key
                token:
                  type: string
                  description: "For auth_type=bearer: Bearer JWT token string. Leave empty for api_key/oauth."
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                headers:
                  type: object
                  description: "For auth_type=custom (or optional extra headers): JSON dictionary of custom HTTP headers."
                  example: {"X-Tenant-ID": "acme_corp"}
                token_url:
                  type: string
                  description: "For auth_type=oauth: OAuth 2.0 Token Exchange endpoint URL. Leave empty if static token is given."
                  example: https://auth.example.com/oauth/token
                client_id:
                  type: string
                  description: "For auth_type=oauth: OAuth 2.0 Client ID."
                  example: my-client-id
                client_secret:
                  type: string
                  description: "For auth_type=oauth: OAuth 2.0 Client Secret."
                  example: my-client-secret
      responses:
        '201':
          description: Upstream server registered successfully



  /admin/mcp/upstreams/{server}/remove:
    post:
      tags:
        - Federation
      summary: Remove upstream server
      description: Unregister an upstream MCP server.
      operationId: removeUpstream
      parameters:
        - name: server
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      responses:

        '200':
          description: Upstream removed

  /admin/openapi/register:
    post:
      tags:
        - OpenAPI Specs
      summary: Register OpenAPI 3.0/3.1 Spec as Live MCP Tools
      description: |
        Parses an OpenAPI spec (HTTP/HTTPS URL, local file path, or raw YAML/JSON text) and dynamically registers all operations as live MCP tools.

        ### Auth Mode Quick Guide (What to give & what can be empty):

        - **No Auth (`auth_type: "none"` or omitted)**:

          - **Give**: `collection_id`, `spec`.

          - **Leave empty**: `api_key`, `header_name`, `token`, `headers`.



        - **API Key (`auth_type: "api_key"`)**:

          - **Give**: `collection_id`, `spec`, `api_key`, and optional `header_name` (default: `X-API-Key`).

          - **Leave empty**: `token`, `headers`.



        - **Bearer Token (`auth_type: "bearer"`)**:

          - **Give**: `collection_id`, `spec`, `token`.

          - **Leave empty**: `api_key`, `header_name`, `headers`.


        - **Custom Headers (`auth_type: "custom"`)**:
        
          - **Give**: `collection_id`, `spec`, `headers` dict (e.g. `{"X-Tenant-ID": "acme"}`).
          
          - **Leave empty**: `api_key`, `header_name`, `token`.
          


        - **Base URL Override**:
        
          - **Give `base_url`** ONLY if you want to override the REST API target endpoint.
          
          - **Leave `base_url` empty/null** to automatically use the `servers` URL defined inside your OpenAPI specification.
          
      operationId: registerOpenAPISpec

      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collection_id
                - spec
              properties:
                collection_id:
                  type: string
                  example: petstore
                spec:
                  type: string
                  description: HTTP URL, local file path, or raw YAML/JSON spec text
                  example: https://petstore.swagger.io/v2/swagger.json
                base_url:
                  type: string
                  description: Optional override for target REST API base URL. If omitted, uses 'servers' URL from spec.
                  example: http://localhost:9998/v1
                auth_type:
                  type: string
                  enum: [bearer, api_key, custom, none]
                  description: "Optional authentication mode (bearer, api_key, custom, none)"
                  example: none
                api_key:
                  type: string
                  description: Optional API Key for authenticating REST calls (used when auth_type=api_key)
                header_name:
                  type: string
                  description: Optional HTTP header name for API Key (default X-API-Key)
                token:
                  type: string
                  description: Optional Bearer JWT token for authenticating REST calls (used when auth_type=bearer)
                headers:
                  type: object
                  description: Optional custom HTTP headers dictionary (used when auth_type=custom)

      responses:
        '201':
          description: OpenAPI spec parsed and tools registered successfully

  /admin/openapi/specs:
    get:
      tags:
        - OpenAPI Specs
      summary: List Registered OpenAPI Spec Collections
      description: Returns a list of all registered OpenAPI collections, base URLs, and generated tool names.
      operationId: listOpenAPISpecs
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      responses:
        '200':
          description: List of registered OpenAPI spec collections

  /admin/openapi/{collection_id}/remove:
    post:
      tags:
        - OpenAPI Specs
      summary: Unregister OpenAPI Spec Collection
      description: Unregisters an OpenAPI collection and removes all of its generated tools from FastMCP.
      operationId: removeOpenAPISpec
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
      security:
        - AdminTokenAuth: []
        - BearerAuth: []

      responses:
        '200':
          description: OpenAPI spec collection unregistered successfully


components:
  schemas:
    ToolInfo:
      type: object
      properties:
        name:
          type: string
          example: text_analyzer
        module:
          type: string
          example: tools.text_analyzer
        description:
          type: string
          example: Analyzes word and character count in input text.
        parameters:
          type: object
          description: JSON Schema of tool input parameters

    ToolCallResponse:
      type: object
      properties:
        tool:
          type: string
          example: text_analyzer
        is_error:
          type: boolean
          example: false
        structured_content:
          type: object
        content:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              text:
                type: string
        error:
          type: string

    PrincipalResponse:
      type: object
      properties:
        principal_id:
          type: string
          example: 8f3b4c1a2d5e...
        issuer:
          type: string
          example: https://bplpycqmizyztxqwglgb.supabase.co/auth/v1
        subject:
          type: string
          example: a1b2c3d4-xxxx-xxxx-xxxx-xxxxxxxxxxxx
        kind:
          type: string
          example: user
        org_id:
          type: string
          example: default
        workspace_id:
          type: string
          example: default
        roles:
          type: array
          items:
            type: string
          example: ["platform_superadmin"]
        permissions:
          type: array
          items:
            type: string
          example: ["tool:list", "tool:call", "platform:admin"]
        metadata:
          type: object
          example: {"email": "oooosomu9@gmail.com"}

    SignUpRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: oooosomu9@gmail.com
        password:
          type: string
          format: password
          example: secretpass123
        metadata:
          type: object
          example: {"name": "Somu Admin"}

    SignInRequest:
      type: object
      required:
        - password
      properties:
        username:
          type: string
          example: oooosomu9@gmail.com
        email:
          type: string
          example: oooosomu9@gmail.com
        password:
          type: string
          format: password
          example: secretpass123

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: eyJhbGci...

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: oooosomu9@gmail.com

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          example: 3600
        refresh_token:
          type: string
        user:
          type: object

  securitySchemes:

    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API Key authentication header
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT token authentication header
    AdminTokenAuth:
      type: http
      scheme: bearer
      description: Admin token for /admin/* endpoints (MCP_ADMIN_TOKEN)
