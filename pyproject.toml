[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-tool-server"
version = "1.0.0"
description = "Production-Grade Fault-Isolated Model Context Protocol (MCP) Server Gateway"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Engineering Team" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "fastmcp>=3.4.0,<4.0.0",
    "starlette>=0.35.0,<2.0.0",
    "uvicorn[standard]>=0.22.0,<1.0.0",
    "watchdog>=3.0.0,<5.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.109.0,<1.0.0",
]
mongo = [
    "motor>=3.3.0,<4.0.0",
]
metrics = [
    "prometheus-client>=0.19.0,<1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-anyio>=0.0.5",
    "httpx>=0.27.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[project.scripts]
mcp-server = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
addopts = "-ra -q --import-mode=importlib"
log_format = '{"Time":"%(asctime)s", "Level": "%(levelname)s", "Message": "%(message)s"}'
log_date_format = "%Y-%m-%dT%H:%M:%SZ"
filterwarnings = [
    "ignore::starlette.types.StarletteDeprecationWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
